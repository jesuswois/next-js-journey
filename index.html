<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Holidays API</title>
    <style>
        body, html{
            margin: 0;
            height: 100%;
            width: 100%;
        }
        .main{
            height: 100%;
            width: 100%;
        }
        #wrapper{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #page-header{
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        #country-select{    
            border-style: outset;
            height: 50%;
        }
        #select-wrapper{
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="wrapper">
            <div id="page-header">
                <h1>Open Holidays API!</h1>
                <div id="select-wrapper">
                    <p>Choose a country to check their holidays!</p>
                    <select name="country" id="country-select">
                        <option value="test">test</option>
                        <option value="test-1">test 2</option>
                    </select>
                </div>
            </div>
            <hr width="80%">
        </div>
    </div>
</body>
</html>
